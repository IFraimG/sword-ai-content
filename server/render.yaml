databases:
  - name: sword-postgres
    databaseName: sword_db
    user: sword_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: sword-ai-content-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: sword-postgres
          property: connectionString
      - key: JWT_SECRET
        value: sword_jwt_production_master_secret_key_2026_render_permanent
