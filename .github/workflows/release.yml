name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v3.3.0)'
        required: true
        default: 'v3.3.0'
      title:
        description: 'Release Title'
        required: false
        default: 'v3.3.0: PostgreSQL Auth & JWT, Real-Time Chats & AI Producer, Responsive Sidebar, 30m+ YouTube Duration & Favorites'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.title || github.ref_name }}
          body: |
            ## 🚀 Release v3.3.0

            ### 🔐 1. Авторизация и регистрация пользователей (PostgreSQL + JWT)
            - **Обязательные уникальные поля**: регистрация и вход по `email`, `login` и `password`.
            - **Безопасная аутентификация по JWT**: срок жизни токена — 7 дней (`7d`), безопасное хранение в cookies браузера (`jwt_token`).
            - **Глобальная защита маршрутов (Route Guard)**: автоматический редирект неавторизованных пользователей с любого защищенного URL на отдельную страницу авторизации `/auth`.
            - **Хранение данных в PostgreSQL**:
              - Уникальный идентификатор `id` (UUID v4) и дата создания аккаунта в формате `DD:MM:YYYY`.
              - Адаптивное подключение к базе данных Render (прямое SSL/non-SSL подключение + локальный синхронизированный fallback).
              - Полная персистентность: никаких деструктивных операций над данными (`ON CONFLICT DO NOTHING`).
              - Автоматическое восстановление и синхронизация пользовательских сессий (`ensureUserExists`).

            ### 💬 2. Личные сообщения в реальном времени и ИИ-продюсер музыки
            - **Реальное время (Real-time Chats)**:
              - Создание диалогов с пользователями платформы в один клик через кнопку «Написать сообщение» на странице пользователей.
              - Обмен сообщениями в реальном времени с поддержкой аватаров, времени отправки и статусов.
            - **🤖 Чат с ИИ-продюсером Ambient-музыки**:
              - Отдельный чат «Создать чат с ИИ» для генерации музыкальных концепций.
              - Мультимодальный ввод: поддержка отправки текстовых запросов и прикрепления референсных изображений (Drag-and-Drop / загрузка файлов).
              - Структурный генератор музыкальных описаний: жанровая принадлежность (ambient, dreamcore, drone, dark ambient), тональность, темп (BPM), синтезаторы, физические инструменты, текстуры, саунд-дизайн и рекомендации для DAW (Ableton Live, FL Studio).

            ### 👥 3. Каталог пользователей и профиль в навигации
            - **Страница «Пользователи» (`/users`)**:
              - Живой поиск пользователей по логину (`@login`).
              - Карточки пользователей с уникальным ID, датой регистрации `DD:MM:YYYY`, email и кнопкой создания диалога.
              - Бейдж «Вы» для текущего авторизованного пользователя.
            - **Профиль в боковой панели**:
              - Отображение текущего логина крупным шрифтом (`@login`), почты более мелким шрифтом, статуса аккаунта и кнопки выхода.

            ### 📱 4. Адаптивная боковая панель (Sidebar) и UX-оптимизации
            - **Левая боковая панель на всех страницах**:
              - Замена верхнего хедера на постоянную стильную боковую панель.
              - Быстрый доступ: «Анализ Reels», «YouTube Ambient», «Избранное YT», «Пользователи», «Чаты».
            - **Мобильный Slide-Over Drawer**:
              - На экранах планшетов и смартфонов боковая панель плавно выдвигается поверх страницы с затемнением внешнего фона (backdrop blur) и сохранением верхнего логотипа.
            - **Устранение горизонтального скролла**:
              - В модальном окне видеоплеера нижняя панель действий переведена на адаптивный перенос строк (`flex-wrap`).
            - **Быстрое копирование**: кнопка копирования ответов ИИ в буфер обмена с всплывающим toast-уведомлением.

            ### ⭐ 5. Избранное YouTube и экспорт сетов
            - **Страница «Избранное YT» (`/youtube-favorites`)**:
              - Сохранение понравившихся длинных видеосетов в `localStorage`.
              - Режим множественного выбора (Select Mode), пакетное удаление и экспорт метаданных и прямых ссылок в формат JSON.

            ### ⏱️ 6. Снижение порога длительности YouTube-видео до 30 минут
            - Минимальная длительность теперь составляет **от 30 минут** ($\ge$ 1800 секунд / 30:00) вместо 1 часа.
            - Динамические бейджи хронометража: `1h+` для видео более часа и `30m+` для роликов от 30 до 59 минут.
            - Расширение базы поиска до 42 специализированных эмбиент-хэштегов с индивидуальным детектированием.
          draft: false
          prerelease: false
          make_latest: true
